function show(k) {
  const t = L[k];
  document.documentElement.lang = k;
  document.documentElement.dir = (k === "ar" || k === "fa") ? "rtl" : "ltr";
  document.title = t.title;
  document.getElementById("t-title").textContent = t.title;
  document.getElementById("t-date").textContent = t.date;
  const sec = (h, ...ps) => `<h2>${h}</h2>` + ps.map(p => p.startsWith("<ul>") ? p : `<p>${p}</p>`).join("");
  document.getElementById("content").innerHTML =
    `<p>${t.intro}</p>` +
    sec(t.h_collect, t.collect) +
    sec(t.h_mic, t.mic) +
    sec(t.h_ads, t.ads, "<ul>" + t.items.map(i => `<li>${i}</li>`).join("") + "</ul>", t.ads_use, t.consent, t.optout) +
    sec(t.h_local, t.local) +
    sec(t.h_children, t.children) +
    sec(t.h_changes, t.changes) +
    sec(t.h_contact, t.contact);
}
const sel = document.getElementById("lang");
sel.innerHTML = Object.entries(L).map(([k, v]) => `<option value="${k}">${v.name}</option>`).join("");
// ?lang=xx, sonra tarayıcı dili, sonra İngilizce.
const want = new URLSearchParams(location.search).get("lang") || (navigator.language || "en").slice(0, 2).toLowerCase();
const start = L[want] ? want : "en";
sel.value = start;
sel.onchange = () => show(sel.value);
show(start);
</script>
